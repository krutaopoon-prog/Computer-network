<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>แบบทดสอบบทที่ 3 - ประเภทเครือข่ายคอมพิวเตอร์</title>
    <link rel="stylesheet" href="../shared/css/global.css?v=1.0">
    <style>
        :root {
            --quiz-color: #7c3aed;
            --quiz-light: #ede9fe;
        }
        .quiz-wrap {
            max-width: 820px;
            margin: 0 auto;
        }
        .quiz-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .quiz-header h2 { color: var(--quiz-color); margin-bottom: 0.5rem; }
        .quiz-progress {
            background: #e0e7ff; height: 10px; border-radius: 5px;
            margin-bottom: 2rem; overflow: hidden;
        }
        .quiz-progress-bar {
            background: linear-gradient(90deg, var(--quiz-color), #3b82f6);
            height: 100%; border-radius: 5px; transition: width 0.4s ease;
        }
        .question-box { margin-bottom: 2rem; }
        .question-number {
            background: var(--quiz-color); color: white;
            padding: 0.4rem 1rem; border-radius: 8px;
            font-weight: bold; display: inline-block; margin-bottom: 1rem;
        }
        .question-text {
            font-size: 1.15rem; font-weight: 600;
            color: #1e293b; margin-bottom: 1.5rem; line-height: 1.6;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        @media (max-width: 560px) { .options-grid { grid-template-columns: 1fr; } }
        .option-btn {
            padding: 0.85rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
            color: #1e293b;
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--quiz-color); background: var(--quiz-light); }
        .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; font-weight: 600; }
        .option-btn.wrong   { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .option-btn:disabled { cursor: default; }
        .option-label {
            display: inline-block; width: 26px; height: 26px;
            background: var(--quiz-color); color: white;
            border-radius: 50%; text-align: center; line-height: 26px;
            font-weight: bold; font-size: 0.85rem; margin-right: 0.6rem;
        }
        .option-btn.correct .option-label { background: #22c55e; }
        .option-btn.wrong   .option-label { background: #ef4444; }
        .feedback-box {
            margin-top: 1rem; padding: 1rem;
            border-radius: 8px; font-size: 0.95rem;
            display: none;
        }
        .feedback-box.correct { background: #f0fdf4; border-left: 4px solid #22c55e; color: #166534; }
        .feedback-box.wrong   { background: #fff1f2; border-left: 4px solid #ef4444; color: #991b1b; }
        .btn-next {
            margin-top: 1.25rem; padding: 0.75rem 2rem;
            background: var(--quiz-color); color: white;
            border: none; border-radius: 10px;
            cursor: pointer; font-size: 1rem; font-weight: 600;
            display: none; width: 100%;
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
            transition: background 0.2s;
        }
        .btn-next:hover { background: #6d28d9; }
        /* Result screen */
        #result-screen { display: none; text-align: center; }
        .score-circle {
            width: 140px; height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--quiz-color) 0%, var(--quiz-color) var(--pct), #e2e8f0 var(--pct));
            display: flex; align-items: center; justify-content: center;
            margin: 1.5rem auto;
        }
        .score-inner {
            width: 110px; height: 110px;
            background: white; border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .score-num { font-size: 2rem; font-weight: bold; color: var(--quiz-color); }
        .score-label { font-size: 0.8rem; color: #64748b; }
        .result-msg { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
        .result-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
        .btn-action {
            padding: 0.65rem 1.5rem; border-radius: 10px;
            border: none; cursor: pointer; font-size: 1rem; font-weight: 600;
            text-decoration: none; font-family: 'Segoe UI', 'Sarabun', sans-serif;
        }
        .btn-retry { background: var(--quiz-color); color: white; }
        .btn-back  { background: #e2e8f0; color: #1e293b; }
        .btn-zombie { background: #ef4444; color: white; }
        .review-list { text-align: left; margin-top: 1.5rem; }
        .review-item {
            padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .review-item.pass { background: #f0fdf4; border-left: 3px solid #22c55e; }
        .review-item.fail { background: #fff1f2; border-left: 3px solid #ef4444; }
    </style>
</head>
<body>
    <header class="page-header" style="background: linear-gradient(135deg, #7c3aed, #2563eb);">
        <h1>แบบทดสอบบทที่ 3</h1>
        <p>ประเภทของเครือข่ายคอมพิวเตอร์</p>
    </header>

    <nav class="breadcrumb">
        <a href="../index.html">Home</a>
        <span>/</span>
        <a href="../network-types/index.html">บทที่ 3</a>
        <span>/</span>
        <span>แบบทดสอบ</span>
    </nav>

    <div class="container">
        <div class="quiz-wrap">

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="quiz-container">
                <div class="quiz-header">
                    <h2>📝 แบบทดสอบบทที่ 3</h2>
                    <p style="color:#64748b; font-size:0.95rem;">ประเภทเครือข่าย, Topology, การให้บริการเครือข่าย</p>
                </div>

                <div class="quiz-progress">
                    <div class="quiz-progress-bar" id="progress-bar" style="width:0%"></div>
                </div>

                <div class="question-box">
                    <div class="question-number" id="q-number">ข้อ 1 / 10</div>
                    <div class="question-text" id="q-text"></div>
                    <div class="options-grid" id="options-grid"></div>
                    <div class="feedback-box" id="feedback-box"></div>
                    <button class="btn-next" id="btn-next" onclick="nextQuestion()">ข้อถัดไป →</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="quiz-container">
                <h2 style="color:var(--quiz-color);">🎉 ผลการทดสอบ</h2>
                <div class="score-circle" id="score-circle">
                    <div class="score-inner">
                        <span class="score-num" id="score-num">0/10</span>
                        <span class="score-label">คะแนน</span>
                    </div>
                </div>
                <div class="result-msg" id="result-msg"></div>
                <div class="result-actions">
                    <button class="btn-action btn-retry" onclick="restartQuiz()">🔄 ทำใหม่</button>
                    <a href="../network-types/index.html" class="btn-action btn-back">📚 กลับทบทวน</a>
                    <a href="../games/zombie-quiz/index.html" class="btn-action btn-zombie">🧟 เล่น Zombie Quiz</a>
                </div>
                <div class="review-list" id="review-list"></div>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        <p>แบบทดสอบบทที่ 3 | Computer Network</p>
    </footer>

    <script>
    const QUIZ_QUESTIONS = [
        {
            q: "เครือข่ายคอมพิวเตอร์ที่ติดตั้งอยู่ในบริเวณใกล้กัน เช่น ในโรงเรียนหรือสำนักงาน เรียกว่าอะไร?",
            opts: ["LAN", "MAN", "WAN", "VAN"],
            ans: 0,
            explain: "LAN (Local Area Network) คือเครือข่ายที่ครอบคลุมพื้นที่จำกัด เช่น อาคาร โรงเรียน สำนักงาน"
        },
        {
            q: "เครือข่ายคอมพิวเตอร์ที่มีระยะการเชื่อมต่อตั้งแต่ 100 กิโลเมตรขึ้นไป เรียกว่าอะไร?",
            opts: ["LAN", "MAN", "WAN", "VAN"],
            ans: 2,
            explain: "WAN (Wide Area Network) ครอบคลุมระดับประเทศหรือข้ามทวีป ระยะ 100 กม. ขึ้นไป"
        },
        {
            q: "การเชื่อมต่อเครือข่ายแบบใดที่ต้องใช้อุปกรณ์รวมสายสัญญาณ (Hub/Switch) เป็นศูนย์กลาง?",
            opts: ["Bus Topology", "Ring Topology", "Star Topology", "Mesh Topology"],
            ans: 2,
            explain: "Star Topology ทุกอุปกรณ์เชื่อมต่อผ่าน Hub หรือ Switch ที่เป็นจุดศูนย์กลาง"
        },
        {
            q: "การเชื่อมต่อเครือข่ายแบบใดที่หากสายหลักขาด ทำให้ทั้งระบบหยุดทำงาน?",
            opts: ["Bus Topology", "Star Topology", "Mesh Topology", "Ring Topology"],
            ans: 0,
            explain: "Bus Topology ใช้สายแกนร่วมกัน หากสายหลักขาด ทุกเครื่องจะหยุดสื่อสาร"
        },
        {
            q: "การให้บริการเครือข่ายแบบใดที่คอมพิวเตอร์ทุกเครื่องเป็นทั้งผู้ให้บริการและผู้ใช้บริการ?",
            opts: ["Client-Server", "Peer to Peer", "Distributor", "Mainframe"],
            ans: 1,
            explain: "Peer-to-Peer (P2P) ทุกเครื่องมีสถานะเท่าเทียมกัน ไม่มีแม่ข่ายหรือลูกข่าย"
        },
        {
            q: "รูปแบบการเชื่อมต่อเครือข่ายแบบใดที่ตรวจหาจุดเสียได้ง่ายที่สุด?",
            opts: ["Bus", "Ring", "Star", "Mesh"],
            ans: 2,
            explain: "Star Topology ตรวจหาจุดเสียได้ง่าย เพราะแต่ละเครื่องมีสายต่างหากไปยัง Hub และสัญญาณ LED บน Hub ช่วยบอกสถานะ"
        },
        {
            q: "ถ้าต้องการเชื่อมต่อเครือข่ายคอมพิวเตอร์เพียง 4 เครื่องในสำนักงานเล็กๆ ควรใช้ระบบการให้บริการแบบใด?",
            opts: ["LAN", "Peer to Peer", "Client Server", "Distributor"],
            ans: 1,
            explain: "Peer-to-Peer เหมาะกับเครือข่ายขนาดเล็ก (ไม่เกิน 10–20 เครื่อง) ค่าใช้จ่ายต่ำ ไม่ต้องมีผู้ดูแล"
        },
        {
            q: "การเชื่อมต่อเครือข่ายแบบใดที่มีระบบชดเชย (Redundant) ทำให้ถ้าสายหนึ่งขาด ยังส่งข้อมูลผ่านเส้นทางอื่นได้?",
            opts: ["Bus Topology", "Ring Topology", "Star Topology", "Mesh Topology"],
            ans: 3,
            explain: "Mesh Topology ทุกโหนดเชื่อมถึงกันหมด มีเส้นทางสำรอง ใช้ใน Internet และ WAN ขนาดใหญ่"
        },
        {
            q: "การให้บริการเครือข่ายแบบ Client-Server มีความปลอดภัยอย่างไร?",
            opts: [
                "ไม่มีระบบความปลอดภัย",
                "มีระบบความปลอดภัยสูง จัดเก็บข้อมูลไว้ที่จุดเดียว",
                "ความปลอดภัยต่ำกว่า Peer-to-Peer",
                "ใช้ระบบเดียวกับ Peer-to-Peer"
            ],
            ans: 1,
            explain: "Client-Server มีระบบความปลอดภัยสูง เพราะข้อมูลจัดเก็บที่ Server กลาง ควบคุมสิทธิ์ผู้ใช้ได้"
        },
        {
            q: "MAN (Metropolitan Area Network) ใช้สื่อกลางชนิดใดเป็นหลัก?",
            opts: [
                "สายโทรศัพท์ทองแดง",
                "สายเคเบิลทีวี",
                "Fiber Optic และ Microwave",
                "สายไฟบ้าน"
            ],
            ans: 2,
            explain: "MAN ใช้ Fiber Optic Cable และ Microwave เป็นสื่อกลาง เพื่อรับส่งข้อมูลระหว่าง LAN ต่างๆ ในเมือง"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = [];
    let userAnswers = [];

    function startQuiz() {
        currentQ = 0; score = 0; answered = []; userAnswers = [];
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        showQuestion();
    }

    function showQuestion() {
        const q = QUIZ_QUESTIONS[currentQ];
        const total = QUIZ_QUESTIONS.length;

        document.getElementById('q-number').textContent = `ข้อ ${currentQ+1} / ${total}`;
        document.getElementById('progress-bar').style.width = `${(currentQ/total)*100}%`;
        document.getElementById('q-text').textContent = q.q;
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';

        const labels = ['ก', 'ข', 'ค', 'ง'];
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        q.opts.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
            btn.onclick = () => selectAnswer(i);
            grid.appendChild(btn);
        });
    }

    function selectAnswer(idx) {
        const q = QUIZ_QUESTIONS[currentQ];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const isCorrect = idx === q.ans;
        if (isCorrect) score++;
        userAnswers[currentQ] = idx;
        answered[currentQ] = isCorrect;

        buttons[idx].classList.add(isCorrect ? 'correct' : 'wrong');
        if (!isCorrect) buttons[q.ans].classList.add('correct');

        const fb = document.getElementById('feedback-box');
        fb.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
        fb.innerHTML = `${isCorrect ? '✅ ถูกต้อง!' : '❌ ไม่ถูกต้อง'} — ${q.explain}`;
        fb.style.display = 'block';

        const btnNext = document.getElementById('btn-next');
        btnNext.style.display = 'block';
        btnNext.textContent = currentQ < QUIZ_QUESTIONS.length - 1 ? 'ข้อถัดไป →' : 'ดูผลคะแนน';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ >= QUIZ_QUESTIONS.length) {
            showResult();
        } else {
            showQuestion();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        const rs = document.getElementById('result-screen');
        rs.style.display = 'block';

        const total = QUIZ_QUESTIONS.length;
        const pct = Math.round((score / total) * 100);

        document.getElementById('score-num').textContent = `${score}/${total}`;
        document.getElementById('score-circle').style.setProperty('--pct', `${pct}%`);

        let msg = '';
        if (pct === 100)    msg = '🏆 ยอดเยี่ยม! เต็มคะแนน!';
        else if (pct >= 80) msg = '🎉 ดีมาก! ผ่านได้อย่างสวยงาม!';
        else if (pct >= 60) msg = '👍 ผ่าน! แต่ยังทบทวนได้อีก';
        else if (pct >= 40) msg = '📚 ยังไม่ผ่าน — กลับไปทบทวนบทที่ 3';
        else                msg = '💪 ยังต้องฝึกเพิ่ม — อ่านทบทวนก่อนนะ';
        document.getElementById('result-msg').textContent = msg;

        const list = document.getElementById('review-list');
        list.innerHTML = '<h3 style="margin-bottom:0.75rem; color:#1e293b;">สรุปรายข้อ</h3>';
        QUIZ_QUESTIONS.forEach((q, i) => {
            const pass = answered[i];
            const div = document.createElement('div');
            div.className = `review-item ${pass ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>ข้อ ${i+1}:</strong> ${pass ? '✅' : '❌'} ${q.q.substring(0, 60)}${q.q.length > 60 ? '...' : ''}`;
            list.appendChild(div);
        });
    }

    function restartQuiz() { startQuiz(); }

    startQuiz();
    </script>
</body>
</html>
